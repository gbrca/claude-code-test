<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autó Szimulátor - BeamNG Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info">
        <h1>Autó Szimulátor</h1>
        <div id="controls">
            <p><strong>Irányítás:</strong></p>
            <ul>
                <li><kbd>W</kbd> / <kbd>↑</kbd> - Gyorsítás</li>
                <li><kbd>S</kbd> / <kbd>↓</kbd> - Fékezés/Tolat</li>
                <li><kbd>A</kbd> / <kbd>←</kbd> - Balra fordulás</li>
                <li><kbd>D</kbd> / <kbd>→</kbd> - Jobbra fordulás</li>
                <li><kbd>SPACE</kbd> - Kézifék</li>
                <li><kbd>C</kbd> - Kamera váltás</li>
                <li><kbd>R</kbd> - Autó visszaállítása</li>
            </ul>
        </div>
        <div id="stats">
            <p>Sebesség: <span id="speed">0</span> km/h</p>
            <p>Kamera: <span id="camera-mode">Követő</span></p>
        </div>
    </div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js physics engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <!-- Main game script -->
    <script src="main.js"></script>
</body>
</html>
